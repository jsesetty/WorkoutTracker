<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow — Elegant Task & To-Do Manager</title>
  <meta name="description" content="A clean, simple, and beautifully responsive task management application built with Node.js and modern vanilla CSS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand-group">
        <div class="logo-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="app-title">FocusFlow</h1>
          <p class="app-subtitle" id="current-date">Loading date...</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle dark/light theme" title="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress Card -->
    <section class="progress-card" aria-label="Task progress summary">
      <div class="progress-header">
        <div class="progress-info">
          <span class="progress-title">Task Completion</span>
          <span class="progress-stats" id="progress-stats-text">0 of 0 completed</span>
        </div>
        <div class="progress-badge" id="progress-percentage-badge">0%</div>
      </div>
      <div class="progress-bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar-widget">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </section>

    <!-- Add Task Input Form -->
    <section class="task-form-card">
      <form id="todo-form" class="todo-form" autocomplete="off">
        <div class="input-wrapper">
          <label for="todo-input" class="sr-only">Add a new task</label>
          <input 
            type="text" 
            id="todo-input" 
            class="todo-input" 
            placeholder="What needs to be done today?" 
            maxlength="150"
            required
          >
          <div class="priority-select-wrapper">
            <label for="priority-select" class="sr-only">Priority level</label>
            <select id="priority-select" class="priority-select" title="Priority">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <button type="submit" id="add-task-btn" class="add-btn" aria-label="Add task">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Toolbar Filters & Bulk Actions -->
    <nav class="toolbar-section" aria-label="Task filters">
      <div class="filter-tabs" role="tablist">
        <button id="filter-all" class="filter-tab active" role="tab" aria-selected="true" data-filter="all">
          All <span class="tab-count" id="count-all">0</span>
        </button>
        <button id="filter-active" class="filter-tab" role="tab" aria-selected="false" data-filter="active">
          Active <span class="tab-count" id="count-active">0</span>
        </button>
        <button id="filter-completed" class="filter-tab" role="tab" aria-selected="false" data-filter="completed">
          Completed <span class="tab-count" id="count-completed">0</span>
        </button>
      </div>

      <button id="clear-completed-btn" class="clear-btn" title="Remove all completed tasks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear Completed</span>
      </button>
    </nav>

    <!-- Tasks List Container -->
    <main class="tasks-container">
      <ul id="todo-list" class="todo-list" aria-label="List of tasks">
        <!-- Rendered dynamically -->
      </ul>

      <!-- Empty State View -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h2 class="empty-title" id="empty-title">All caught up!</h2>
        <p class="empty-desc" id="empty-desc">You don't have any tasks in this view.</p>
      </div>
    </main>

    <!-- Footer Note -->
    <footer class="app-footer">
      <p>Tip: Double-click any task title to edit it. Press <kbd>Enter</kbd> to save.</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
